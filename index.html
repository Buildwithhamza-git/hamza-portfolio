      content="Hamza Sarwar is a Computer Science graduate and Full-Stack Developer specializing in the MERN stack, AI/ML and modern web applications. Explore his selected work and get in touch."
    />
    <meta name="theme-color" content="#050505" />
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('hamza-theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          document.documentElement.setAttribute('data-theme', t)
          document.documentElement.style.colorScheme = t
        } catch (e) {}
      })()
    </script>
